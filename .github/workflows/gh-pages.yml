# .github/workflows/gh-pages.yml
# Workflow to build and deploy the application to GitHub Pages

name: Deploy to GitHub Pages

on:
  # Trigger deployment when the "Semantic Release" workflow completes successfully on main
  workflow_run:
    workflows: ['Semantic Release']
    types:
      - completed
    branches:
      - main
  # Also allow deployment when documentation is updated directly on main
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

concurrency:
  group: 'pages'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build job: Install dependencies, build the application, and upload the artifact
  build:
    name: Build Application & Docs
    # Build if triggered by push/dispatch or if workflow_run concluded with success
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main branch code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Prepare 404 page for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Deploy job: Deploy the uploaded artifact to GitHub Pages
  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
